<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GeoDrill</title>
<meta name="description" content="Geography drills on a 3D globe: place countries and cities, find hidden countries hot-and-cold, learn borders, flags, states and street-level clues.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e131c" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GeoDrill">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f4f1ea; --panel:#ffffff; --text:#1d2230; --muted:#6b7280; --line:#e2ddd2;
  --accent:#1f6feb; --accent-text:#ffffff; --ok:#1a8f4d; --warn:#d97706; --bad:#c2271d;
  --ocean:#cfe0f2; --land:#ebe6da; --land-alt:#f6f1e4; --border:#b9b1a2; --grat:rgba(0,0,0,.06);
  --chip:#f1eee6; --chip-on:#dbe7fb; --panel-faint:rgba(255,255,255,.72);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e131c; --panel:#161c27; --text:#e8ebf1; --muted:#9aa3b2; --line:#2a3242;
    --accent:#4c8dff; --accent-text:#0b1220; --ok:#34c372; --warn:#f0a53a; --bad:#ff6b5c;
    --ocean:#0b1d33; --land:#2f3a4d; --land-alt:#3d4a60; --border:#5a6a85; --grat:rgba(255,255,255,.07);
    --chip:#1f2735; --chip-on:#263d66; --panel-faint:rgba(22,28,39,.72);
  }
}
:root[data-theme="dark"]{
  --bg:#0e131c; --panel:#161c27; --text:#e8ebf1; --muted:#9aa3b2; --line:#2a3242;
  --accent:#4c8dff; --accent-text:#0b1220; --ok:#34c372; --warn:#f0a53a; --bad:#ff6b5c;
  --ocean:#0b1d33; --land:#2f3a4d; --land-alt:#3d4a60; --border:#5a6a85; --grat:rgba(255,255,255,.07);
  --chip:#1f2735; --chip-on:#263d66; --panel-faint:rgba(22,28,39,.72);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;display:flex;flex-direction:column;touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
html,body{height:100dvh}
header{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-top:max(10px,env(safe-area-inset-top))}
#side{padding-bottom:max(16px,env(safe-area-inset-bottom))}
#installbtn{display:none}
#installbtn.show{display:inline-block}
a{color:var(--accent)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font:inherit;cursor:pointer}
#ghints{margin-top:4px;display:grid;gap:2px}
.btn:focus-visible,.chip:focus-visible,nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:10;display:flex;gap:10px;align-items:center}
.toast button{background:var(--accent);color:var(--accent-text);border:0;border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:17px;margin:0 6px 0 0;letter-spacing:.2px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;border:1px solid transparent;color:var(--muted);padding:5px 8px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px;white-space:nowrap}
nav button:hover{color:var(--text);background:var(--chip)}
nav button.on{color:var(--text);background:var(--chip-on);border-color:var(--line)}
.spacer{flex:1}
.iconbtn{background:var(--chip);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 9px;cursor:pointer;font:inherit;font-size:13px;white-space:nowrap}
main{flex:1;display:grid;grid-template-columns:1fr 380px;min-height:0}
#globe-wrap{position:relative;min-height:320px;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.tap{cursor:crosshair}
#tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:4px 8px;border-radius:6px;font-size:13px;transform:translate(12px,12px);display:none;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#gctl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
#gctl button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
#gctl #lbl{font-size:13px;font-weight:700}
#gctl button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;font-size:16px}
#side{border-left:1px solid var(--line);background:var(--panel);padding:16px;overflow:auto}
#panel h2{font-size:16px;margin:0 0 6px}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.prompt{font-size:26px;font-weight:650;margin:8px 0 2px;line-height:1.2}
.hint{color:var(--muted);font-size:13px;min-height:18px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0;background:var(--bg)}
.card.ok{border-color:var(--ok)} .card.bad{border-color:var(--bad)} .card.warn{border-color:var(--warn)}
.big{font-size:22px;font-weight:650}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--accent);color:var(--accent-text);border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--chip);color:var(--text);border:1px solid var(--line);font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.opts .btn{text-align:left;padding:12px;background:var(--chip);color:var(--text);border:1px solid var(--line);font-weight:500}
.opts .btn.ok{background:color-mix(in srgb,var(--ok) 25%,var(--chip));border-color:var(--ok)}
.opts .btn.bad{background:color-mix(in srgb,var(--bad) 25%,var(--chip));border-color:var(--bad)}
.opts .btn.miss{outline:2px dashed var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer;font:inherit;font-size:14px;color:var(--text)}
.chip.on{background:var(--chip-on);border-color:var(--accent)}
.chip.ok{background:color-mix(in srgb,var(--ok) 30%,var(--chip));border-color:var(--ok)}
.chip.bad{background:color-mix(in srgb,var(--bad) 30%,var(--chip));border-color:var(--bad)}
.chip.miss{border-color:var(--warn);border-style:dashed}
input[type=text]{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:16px}
.glist{list-style:none;padding:0;margin:10px 0;max-height:40vh;overflow:auto}
.glist li{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;font-size:14px}
.glist li .sw{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.2);flex:none}
.glist li .d{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.stat{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line);font-size:14px}
.stat b{font-variant-numeric:tabular-nums}
.coach{font-size:13px;color:var(--muted);margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.coach li{margin:3px 0}
label.cb{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);margin-right:8px}
.scorebar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;margin:6px 0}
.scorebar i{display:block;height:100%;background:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px;background:color-mix(in srgb,var(--bg) 60%,transparent);pointer-events:none}
#scope{display:flex;gap:6px}
.flag{width:22px;height:16.5px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.15);vertical-align:-3px;margin-right:7px;flex:none}
.flag.big{width:36px;height:27px;vertical-align:-5px;margin-right:10px}
.flagstage{display:flex;justify-content:center;margin:10px 0 14px}
.flagstage img{width:min(100%,300px);aspect-ratio:4/3;object-fit:cover;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.urow .un{display:flex;align-items:center}
.clues{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;margin:8px 0}
.clue{display:contents}
.clue .ck{color:var(--muted);white-space:nowrap}
.cluebox{margin-top:8px;font-size:13px}
.cluebox summary{cursor:pointer;color:var(--muted);font-weight:600}
#scope select{background:var(--chip);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 6px;font:inherit;font-size:12.5px;max-width:170px}
.scopeline{font-size:13px;color:var(--muted);margin:0 0 8px}
#trainbar:empty{display:none}
.sharedbar{border:1px dashed var(--accent);border-radius:8px;padding:8px 10px;margin:6px 0 10px;font-size:13px;background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
#trainbar{border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel));border-radius:10px;padding:10px 12px;margin:0 0 14px;font-size:14px}
#trainbar .tbt{font-weight:650}
#trainbar .row{margin-top:8px}
.bigopts{display:grid;gap:10px;margin:14px 0}
.bigopts button{text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--text);font:inherit;cursor:pointer}
.bigopts button b{display:block;font-size:18px;margin-bottom:2px}
.bigopts button small{color:var(--muted);font-size:13px}
.bigopts button:hover{border-color:var(--accent);background:var(--chip-on)}
.ulist{margin:8px 0;max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.ugroup{position:sticky;top:0;background:var(--panel);padding:6px 10px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);border-bottom:1px solid var(--line)}
.urow{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:6px 10px;cursor:pointer;font-size:14px;border-bottom:1px dashed var(--line)}
.urow:hover{background:var(--chip)} .urow.on{background:var(--chip-on)}
.urow .ub{font-size:12px;min-width:44px;text-align:right}
.urow .uc{font-size:13px}
@media (max-width:860px){
  html,body{overflow:hidden}
  main{grid-template-columns:1fr;grid-template-rows:42vh 1fr}
  #side{border-left:0;border-top:1px solid var(--line)}
  #globe-wrap{min-height:0}
  header{display:grid;grid-template-columns:1fr auto auto auto auto;grid-template-areas:"title install share stats theme" "nav nav nav nav nav" "scope scope scope scope scope";row-gap:6px;column-gap:6px;padding-bottom:8px;min-width:0}
  header h1{grid-area:title}
  #statsbtn{grid-area:stats} #themebtn{grid-area:theme} #installbtn{grid-area:install} #sharebtn{grid-area:share}
  nav{grid-area:nav;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;gap:2px;min-width:0;
      -webkit-mask-image:linear-gradient(to right,#000 85%,transparent);mask-image:linear-gradient(to right,#000 85%,transparent);padding-right:28px}
  nav::-webkit-scrollbar{display:none}
  nav button{min-height:36px;font-size:14px;padding:6px 10px}
  #scope{grid-area:scope;min-width:0} #scope select{flex:1 1 0;width:0;min-width:0;max-width:none;min-height:36px}
  .spacer{display:none}
}
</style>
</head>
<body>
<header>
  <h1>GeoDrill</h1>
  <nav id="nav"></nav>
  <span class="spacer"></span>
  <div id="scope"><select id="level" title="Level"></select><select id="region" title="Region"></select></div>
  <button class="iconbtn" id="installbtn" title="Install GeoDrill as an app">Install</button>
  <button class="iconbtn" id="sharebtn" title="Copy a link to this view or game">Share</button>
  <button class="iconbtn" id="statsbtn">Stats</button>
  <button class="iconbtn" id="themebtn" title="Toggle theme">◐</button>
</header>
<main>
  <section id="globe-wrap">
    <canvas id="globe"></canvas>
    <div id="tip"></div>
    <div id="gctl">
      <button id="zin" title="Zoom in">+</button>
      <button id="zout" title="Zoom out">−</button>
      <button id="zreset" title="Reset view">⌂</button>
      <button id="lbl" title="Show names" aria-label="Show names" aria-pressed="false">Aa</button>
    </div>
    <div id="loading">Loading map…</div>
  </section>
  <aside id="side"><div id="trainbar"></div><div id="panel"></div></aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js" crossorigin="anonymous"></script>
<script src="data/iso.js"></script>
<script src="data/clues.js"></script>
<script src="data/places.js"></script>
<script src="data/regions.js"></script>
<script src="data/subcapitals.js"></script>
<script src="data/subcities.js"></script>
<script src="app.js"></script>
<script src="pwa.js"></script>
</body>
</html>
